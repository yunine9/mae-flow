name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    name: release-gate (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.8'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lean semantic scenarios
        run: python scripts/tests/test_lean_semantic_scenarios.py
      - name: Windows runtime semantics
        run: python scripts/tests/test_windows_lean_runtime.py
      - name: Discover all tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Structured selftest
        run: python scripts/selftest.py
      - name: Whitespace check
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
