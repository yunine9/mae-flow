name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    name: release-gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lean semantic scenarios
        run: python scripts/tests/test_lean_semantic_scenarios.py
      - name: Windows runtime semantics
        run: python scripts/tests/test_windows_lean_runtime.py
      - name: Discover all tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Structured selftest
        run: python scripts/selftest.py
      - name: Whitespace check
        run: git diff --check
